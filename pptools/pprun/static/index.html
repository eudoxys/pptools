<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pprun</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%231f6f5c%22/%3E%3Ccircle cx=%225%22 cy=%2211%22 r=%222%22 fill=%22white%22/%3E%3Ccircle cx=%2211%22 cy=%225%22 r=%222%22 fill=%22white%22/%3E%3Cpath d=%22M5 11L11 5%22 stroke=%22white%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/pprun/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" id="home" href="/" title="Back to pptools"><span class="mark">pp</span>tools</a>
  <span class="crumb">/</span>
  <span class="brand"><span class="mark">pp</span>run</span>
  <span class="crumb" id="crumb-project"></span>
  <span class="divider"></span>
  <label class="bar-field" title="Simulation definition in sims/">Simulation
    <select id="sim-select"></select></label>
  <button data-action="new-sim" title="New simulation definition">New…</button>
  <button data-action="save" id="save-btn" title="Save the definition (Ctrl+S)">Save</button>
  <span id="dirty" class="dirty" hidden title="Unsaved changes">●</span>
  <span class="divider"></span>
  <button class="primary" data-action="run" id="run-btn" title="Save, check and run this simulation">Run</button>
  <button data-action="cancel" id="cancel-btn" hidden>Cancel</button>
  <div class="run-progress" id="run-progress" hidden><div class="fill"></div><span class="text"></span></div>
  <span class="spacer"></span>
</header>

<nav class="tabs" id="tabs">
  <button data-view="settings">Settings <span class="count issues" id="issue-count"></span></button>
  <button data-view="network">Network</button>
  <button data-view="inputs">Inputs <span class="count" id="input-count"></span></button>
  <button data-view="outputs">Outputs</button>
  <button data-view="runs">Runs <span class="count" id="run-count"></span></button>
</nav>

<main id="main">
  <section id="view-empty" class="view pad"></section>
  <section id="view-settings" class="view pad"></section>
  <section id="view-network" class="view">
    <div class="net-bar">
      <label>Show <select id="net-source"></select></label>
      <span id="net-time-wrap" hidden>
        <input type="range" id="net-time" min="0" max="0" value="0">
        <span id="net-time-label" class="mono"></span>
        <button data-action="snapshot" class="primary">Show time step</button>
      </span>
      <span id="net-note" class="muted"></span>
    </div>
    <iframe id="net-frame" title="Network (ppedit)"></iframe>
    <div id="net-empty" class="net-empty muted"></div>
  </section>
  <section id="view-inputs" class="view split">
    <aside class="list" id="input-list"></aside>
    <div class="viewer" id="inputs-viewer"></div>
  </section>
  <section id="view-outputs" class="view split">
    <aside class="list">
      <label class="list-head">Run <select id="output-run"></select></label>
      <div id="output-list"></div>
    </aside>
    <div class="viewer" id="outputs-viewer"></div>
  </section>
  <section id="view-runs" class="view pad"></section>
</main>

<dialog id="new-dialog">
  <form method="dialog" id="new-form">
    <h2>New simulation</h2>
    <label>Name <input name="sim" required pattern="[A-Za-z0-9][A-Za-z0-9_.\-]{0,58}" placeholder="base"></label>
    <label>Model <select name="model" required></select></label>
    <label>Start <input name="start" placeholder="2020-01-01 00:00"></label>
    <label>End <input name="end" placeholder="2020-01-02 00:00"></label>
    <p class="muted">Times are UTC unless they carry an offset; the time step is 1 h (change it in Settings).</p>
    <div class="dialog-buttons"><button value="cancel" formnovalidate>Cancel</button><button value="ok" class="primary">Create</button></div>
  </form>
</dialog>

<dialog id="confirm-dialog">
  <form method="dialog">
    <h2>Discard changes?</h2>
    <p>The simulation has unsaved changes.</p>
    <div class="dialog-buttons"><button value="cancel">Keep editing</button><button value="ok" class="primary">Discard</button></div>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>
<script src="/pprun/static/app.js"></script>
</body>
</html>
